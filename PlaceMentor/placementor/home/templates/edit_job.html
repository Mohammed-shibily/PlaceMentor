{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Job | PlaceMentor{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
{% endblock %}

{% block content %}
<div class="premium-dashboard container py-5 animate__animated animate__fadeIn">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="glass-panel p-5 position-relative overflow-hidden">
        <div class="position-absolute top-0 start-0 w-100 h-100 pointer-events-none" style="background: radial-gradient(circle at 10% 0%, var(--teal-glow) 0%, transparent 40%); z-index: 0;"></div>
        <div class="position-relative" style="z-index: 1;">
        <div class="d-flex align-items-center gap-3 mb-4">
          <div class="bg-gold-soft p-3 rounded-4">
            <i class="fa-solid fa-pen-to-square fs-2"></i>
          </div>
          <div>
            <h2 class="fw-bold text-white mb-0">Edit Job Posting</h2>
            <p class="text-white-50 mb-0">Update the details for "{{ job.title }}"</p>
          </div>
        </div>

        <form method="POST" class="mt-4">
          {% csrf_token %}
          
          <div class="mb-4">
            <label class="form-label text-white-50 small text-uppercase tracking-widest fw-semibold ms-1">Job Title</label>
            <input type="text" name="title" value="{{ job.title }}" class="form-control premium-input py-3" required>
          </div>

          <div class="mb-4">
            <label class="form-label text-white-50 small text-uppercase tracking-widest fw-semibold ms-1">Description</label>
            <textarea name="description" rows="5" class="form-control premium-input py-3" required>{{ job.description }}</textarea>
          </div>

          <div class="row g-4 mb-4">
            <div class="col-md-6">
              <label class="form-label text-white-50 small text-uppercase tracking-widest fw-semibold ms-1">Eligibility (CGPA)</label>
              <input type="number" step="0.01" name="eligibility_cgpa" value="{{ job.eligibility_cgpa }}" class="form-control premium-input py-3">
            </div>
            <div class="col-md-6">
              <label class="form-label text-white-50 small text-uppercase tracking-widest fw-semibold ms-1">Last Date to Apply</label>
              <input type="date" name="last_date" value="{{ job.last_date|date:'Y-m-d' }}" class="form-control premium-input py-3" required>
            </div>
          </div>

          <div class="mb-5">
            <label class="form-label text-white-50 small text-uppercase tracking-widest fw-semibold ms-1">Required Skills</label>
            <input type="text" name="skills_required" value="{{ job.skills_required }}" class="form-control premium-input py-3" placeholder="e.g. Python, SQL, React">
            <div class="form-text text-white-50 small ms-1 mt-2">Separate skills with commas.</div>
          </div>

          <div class="d-flex gap-3">
            <button type="submit" class="btn-premium btn-teal-gradient py-3 fw-bold flex-grow-1 border-0" style="border-radius: 12px; font-size: 1.1rem;">
              Update Job Posting
            </button>
            <a href="{% url 'hrdashboard' %}" class="btn-premium btn-outline-ghost py-3 fw-bold d-flex align-items-center justify-content-center" style="border-radius: 12px; min-width: 140px;">
              Cancel
            </a>
          </div>
        </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
